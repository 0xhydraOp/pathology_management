# Verification/build artifacts only. Reviewed publication is explicit and manual.
name: Windows candidate verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: offline-unsigned-candidate
          path: |
            release/*Offline*Setup*.exe
            release/*Offline*Windows-Install-Package.zip
